# ============================================================
# docker-compose.prod.yml — Despliegue de Producción CASETECH ERP
# ============================================================
# Arquitectura de Producción:
# - DB: PostgreSQL 16 Alpine aislado en red interna privada (puerto 5432 no expuesto al host)
# - Backend: FastAPI ejecutado con 4 workers (sin reload) por usuario appuser no-root
# - Frontend: Nginx Alpine multi-stage con SPA fallback, gzip y proxy reverso en puerto 80
# ============================================================

services:
  # ============================================================
  # 1. Base de datos PostgreSQL 16 Alpine
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: casetech_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casetech_db}
      POSTGRES_USER: ${POSTGRES_USER:-casetech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria en produccion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTA DE SEGURIDAD CRÍTICA: Puerto 5432 NO se expone al host en producción
    networks:
      - casetech_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casetech} -d ${POSTGRES_DB:-casetech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # 2. Backend FastAPI (Python 3.11 + UV + 4 Workers + Non-Root)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casetech_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-casetech_db}
      POSTGRES_USER: ${POSTGRES_USER:-casetech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria en produccion}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria en produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      # Nota: en producción NO se pasan ADMIN_INITIAL_PASSWORD / OPERARIO_INITIAL_PASSWORD.
      # init_db no siembra usuarios cuando ENVIRONMENT=production; el primer administrador se
      # crea a propósito con:  python -m app.scripts.create_admin  (ver docs/07-despliegue.md).
    networks:
      - casetech_network
    depends_on:
      db:
        condition: service_healthy
    # ¿Qué? Aplica migraciones y arranca uvicorn escuchando en TODAS las interfaces, con 4 workers.
    # ¿Para qué? Que Nginx (otro contenedor) pueda alcanzar al backend por la red de Docker.
    # ¿Impacto? Antes se escribía con "command: >" en varias líneas: YAML conservaba los saltos
    # de línea, el shell ejecutaba "uvicorn app.main:app" SIN flags y escuchaba solo en
    # 127.0.0.1 (1 worker) -> Nginx recibía "Connection refused". Ahora va en UNA sola línea.
    # "exec" hace que uvicorn sea el proceso principal y reciba las señales de parada de Docker.
    # --proxy-headers + --forwarded-allow-ips='*': confía en X-Forwarded-Proto/For que pone Nginx,
    # para que las redirecciones usen https cuando el sitio se sirve con HTTPS. Es seguro porque
    # el puerto 8000 NO se publica al host: solo Nginx (en la red interna) puede llegar al backend.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log --proxy-headers --forwarded-allow-ips='*'"]
    healthcheck:
      # Antes terminaba con "|| exit 0", así que SIEMPRE reportaba "healthy".
      # Ahora /health falla (HTTP 503) si el backend no conecta con la base de datos.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # 3. Frontend Nginx (Producción Multi-Stage + Reverse Proxy)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Vacío = el navegador llama a /api/v1/... en la misma dirección del sitio y Nginx
        # lo reenvía al backend (ver frontend/nginx.conf). No usar la VITE_API_URL del
        # desarrollo (http://localhost:8000): en un servidor real apuntaría a otra máquina.
        VITE_API_URL: ""
    container_name: casetech_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - casetech_network
    depends_on:
      backend:
        condition: service_healthy   # espera a que /health responda 200 (backend + BD listos)
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ============================================================
# Volúmenes persistentes
# ============================================================
volumes:
  postgres_data:
    driver: local

# ============================================================
# Red interna aislada
# ============================================================
networks:
  casetech_network:
    driver: bridge
