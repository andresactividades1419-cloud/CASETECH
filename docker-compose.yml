services:
  # ============================================================
  # Servicio: Base de datos PostgreSQL 16
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: casetech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casetech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD debe configurarse en .env}
      POSTGRES_DB: ${POSTGRES_DB:-casetech_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - casetech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casetech} -d ${POSTGRES_DB:-casetech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Servicio: Backend FastAPI (Python 3.11 + UV)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casetech-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casetech}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD debe configurarse en .env}@db:5432/${POSTGRES_DB:-casetech_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD debe configurarse en .env}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET debe configurarse en .env (generar con: python -c "import secrets; print(secrets.token_hex(32))")}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      OPERARIO_INITIAL_PASSWORD: ${OPERARIO_INITIAL_PASSWORD:-}
    volumes:
      - ./backend:/app
      # Excluir .venv del volumen para preservar las dependencias del contenedor
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    networks:
      - casetech-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app
             --host 0.0.0.0
             --port 8000
             --reload
             --reload-dir /app/app"

  # ============================================================
  # Servicio: Frontend React 18 (Node 20 LTS + PNPM)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casetech-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      # Excluir node_modules del volumen para preservar las dependencias del contenedor
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - casetech-network
    depends_on:
      - backend

# ============================================================
# Volúmenes nombrados
# ============================================================
volumes:
  postgres_data:
    driver: local
  backend_venv:
    driver: local
  frontend_node_modules:
    driver: local

# ============================================================
# Red virtual aislada del proyecto
# ============================================================
networks:
  casetech-network:
    driver: bridge
    name: casetech-network
