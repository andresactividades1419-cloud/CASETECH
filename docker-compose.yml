services:
  # ============================================================
  # Servicio: Base de datos PostgreSQL 16
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: casetech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casetech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}
      POSTGRES_DB: ${POSTGRES_DB:-casetech_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - casetech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casetech} -d ${POSTGRES_DB:-casetech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Servicio: Backend FastAPI (Python 3.11 + UV)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casetech-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casetech}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}@db:5432/${POSTGRES_DB:-casetech_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      OPERARIO_INITIAL_PASSWORD: ${OPERARIO_INITIAL_PASSWORD:-}
      # Log de SQL apagado por defecto (miles de líneas); SQL_ECHO=true en .env lo activa.
      SQL_ECHO: ${SQL_ECHO:-false}
      # En Windows/macOS la carpeta ./backend se comparte con el contenedor y el
      # vigilante de archivos de uvicorn --reload falla con "Input/output error"
      # y tumba el contenedor. Con "polling" revisa los archivos periódicamente.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      # Excluir .venv del volumen para preservar las dependencias del contenedor
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    networks:
      - casetech-network
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"]
    # /health responde 200 solo si el backend está arriba Y conecta con PostgreSQL.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============================================================
  # Servicio: Frontend React 18 (Node 20 LTS + PNPM)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: casetech-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      # Excluir node_modules del volumen para preservar las dependencias del contenedor
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "pnpm install --config.confirmModulesPurge=false && pnpm run dev"
    networks:
      - casetech-network
    depends_on:
      - backend

# ============================================================
# Volúmenes nombrados
# ============================================================
volumes:
  postgres_data:
    driver: local
  backend_venv:
    driver: local
  frontend_node_modules:
    driver: local

# ============================================================
# Red virtual aislada del proyecto
# ============================================================
networks:
  casetech-network:
    driver: bridge
    name: casetech-network
