[project]
name = "casetech-backend"
version = "0.1.0"
description = "Backend FastAPI para CASETECH — ERP de Gestión de Casetones"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "CASETECH Team" }
]

# ============================================================
# Dependencias de producción — versiones fijas sin comodines
# ============================================================
dependencies = [
    # Framework web ASGI de alto rendimiento
    "fastapi==0.110.0",
    # Servidor ASGI para FastAPI
    "uvicorn==0.28.0",
    # ORM con soporte async/await
    "sqlalchemy==2.0.28",
    # Migraciones de base de datos
    "alembic==1.13.1",
    # Driver PostgreSQL para Python
    "psycopg2-binary==2.9.9",
    # Validación y serialización de datos (core en Rust)
    "pydantic==2.6.4",
    # Configuración via variables de entorno con Pydantic
    "pydantic-settings==2.2.1",
    # Hashing de contraseñas
    "passlib==1.7.4",
    # Implementación bcrypt para passlib
    "bcrypt==4.1.2",
    # Manejo de tokens JWT
    "python-jose==3.3.0",
    # Soporte a formularios multipart (requerido por FastAPI)
    "python-multipart==0.0.9",
]

# ============================================================
# Dependencias de desarrollo — no se instalan en producción
# ============================================================
[dependency-groups]
dev = [
    # Framework de testing
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    # Linting y formateo
    "ruff==0.3.4",
    # Type checking
    "mypy==1.9.0",
]

# ============================================================
# Configuración de herramientas
# ============================================================
[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# Ruff — Linting y formateo
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

# ============================================================
# MyPy — Type checking
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
