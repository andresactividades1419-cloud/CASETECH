# ============================================================
# Nginx Configuration for CASETECH ERP Production Frontend
# Reverse Proxy, SPA Router, Security Headers & Gzip Compression
# ============================================================

# ¿Qué? Decide qué esquema (http/https) se le informa al backend.
# ¿Para qué? Si delante de este Nginx hay otro proxy que termina el HTTPS (Caddy, Traefik,
# balanceador de la nube), él ya manda X-Forwarded-Proto: https y hay que respetarlo; si
# no viene la cabecera, se usa el esquema de esta conexión.
# ¿Impacto? Sin esto las redirecciones del backend saldrían como http:// detrás de HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # ------------------------------------------------------------
    # IP real del cliente (anti-suplantación de X-Forwarded-For)
    # ------------------------------------------------------------
    # ¿Qué? Solo se cree en X-Forwarded-For si la conexión llega desde una red PRIVADA
    # (un proxy/balanceador propio delante de este Nginx). De una IP pública se ignora.
    # ¿Para qué? El backend limita los intentos de login por IP. Si Nginx aceptara el
    # X-Forwarded-For que manda cualquier cliente, un atacante lo cambiaría en cada intento
    # y se saltaría el límite.
    # ¿Impacto? real_ip_recursive toma la última IP no confiable de la cadena (la del
    # cliente real) y más abajo se sobrescribe X-Forwarded-For con ella.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ------------------------------------------------------------
    # Cabeceras de Seguridad
    # ------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ------------------------------------------------------------
    # Compresión Gzip
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ------------------------------------------------------------
    # Reverse Proxy hacia FastAPI Backend (/api/)
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $http_host (y no $host) conserva el puerto. FastAPI redirige /materials -> /materials/
        # usando este Host; sin el puerto, la redirección apuntaba a una dirección inalcanzable.
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE con la IP ya validada (no se anexa a lo que mande el cliente).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Nota: se quitaron los proxies de /docs y /openapi.json. Apuntaban a rutas que no existen
    # en el backend (la documentación vive en /api/v1/docs y solo con DEBUG=true, nunca en
    # producción), así que solo devolvían errores. /api/v1/docs ya queda cubierto por /api/.

    # ------------------------------------------------------------
    # Caché para activos estáticos (CSS, JS, Imágenes, Fuentes)
    # ------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------
    # SPA Fallback a index.html (React Router DOM v6)
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # Páginas de Error
    # ------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
